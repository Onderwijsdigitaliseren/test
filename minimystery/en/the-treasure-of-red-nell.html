<style>
:root{--ink:#0a1a22;--sea:#12323f;--sea2:#1b4a5a;--parch:#ecdcb4;--parch2:#d6bf8c;--gold:#e8b93e;--red:#b5432c;--txt:#f3ead2;--dim:#9db3b5}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--ink);color:var(--txt);font-family:Georgia,'Iowan Old Style','Palatino Linotype',serif;overflow:hidden;overscroll-behavior:none;-webkit-user-select:none;user-select:none}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
.scr{position:fixed;inset:0;display:none;flex-direction:column}
.scr.on{display:flex}
h1,h2,h3{font-weight:normal;margin:0;letter-spacing:.02em}
.btn{background:var(--gold);color:#2a1c05;padding:14px 22px;border-radius:999px;font-size:17px;font-weight:bold;box-shadow:0 4px 0 #8a6510,0 8px 20px #0006}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 #8a6510}
.btn.sec{background:transparent;color:var(--txt);border:1.5px solid #ffffff55;box-shadow:none;font-weight:normal}
.btn.sm{padding:9px 14px;font-size:14px}
/* start */
#s-start{overflow-y:auto;align-items:center;padding:14px 18px 40px;background:linear-gradient(180deg,rgba(10,26,34,.5) 0,rgba(10,26,34,.05) 20%,rgba(10,26,34,.1) 40%,rgba(10,26,34,.93) 60%,#0a1a22 100%),url(../games/neel/img/hero.webp) 30% top/cover no-repeat,radial-gradient(120% 80% at 50% 0,#1d5263 0,#0a1a22 70%)}
#s-start h1{text-shadow:0 2px 12px #000,0 0 30px #000}
.tag{text-shadow:0 1px 6px #000}
#hsp{height:27vh}
#s-start .in{max-width:460px;width:100%;text-align:center}
#hero{width:104px;height:104px;margin:0 auto;display:block;position:relative}
#hero img,#hero svg{position:absolute;inset:0;width:100%;height:100%}
#s-start h1{font-size:34px;line-height:1.05;margin-top:6px;color:var(--parch)}
#s-start h1 b{color:var(--gold);font-weight:normal;display:block;font-size:42px}
.tag{color:var(--dim);font-size:14px;margin:8px 0 18px;font-style:italic}
.modes{display:grid;gap:10px;margin:14px 0}
.mode{display:flex;gap:12px;align-items:center;text-align:left;padding:12px 14px;border-radius:14px;border:1.5px solid #ffffff22;background:#07141ad9;width:100%}
.mode.on{border-color:var(--gold);background:#2b2410f2}
.mode i{font-style:normal;font-size:26px;width:36px;text-align:center}
.mode b{display:block;font-size:17px;color:var(--parch)}
.mode span{font-size:13px;color:var(--dim)}
.seg{display:flex;gap:8px;justify-content:center;margin:4px 0 16px;flex-wrap:wrap}
.seg button{padding:8px 14px;border-radius:999px;border:1.5px solid #ffffff33;font-size:14px;background:#07141ad9}
.seg button.on{background:var(--parch);color:#2a1c05;border-color:var(--parch)}
.small{font-size:13px;color:var(--dim);line-height:1.45}
/* topbar */
.top{display:flex;align-items:center;gap:8px;padding:10px 12px;background:#07141acc;backdrop-filter:blur(6px);z-index:5;min-height:52px}
.top h2{font-size:17px;flex:1;color:var(--parch);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pill{display:flex;align-items:center;gap:5px;padding:7px 11px;border-radius:999px;background:#ffffff14;font-size:14px;white-space:nowrap}
.pill .c{width:16px;height:16px;border-radius:50%;background:url(../games/neel/img/munt.webp) center/cover,radial-gradient(circle at 35% 30%,#fff3b0,#e8b93e 55%,#9a6d0e);display:inline-block}
/* map */
#s-map{background:#0a1a22}
#mapwrap{background:#1a0d04}
#mapwrap{flex:1;position:relative;min-height:0}
#map{position:absolute;inset:0;width:100%;height:100%}
#mpanel{padding:12px 14px 18px;background:#07141a;border-top:1px solid #ffffff1a;text-align:center}
#mpanel h3{font-size:19px;color:var(--parch)}
#mpanel p{margin:5px 0 10px;font-size:14px;color:var(--dim);line-height:1.4}
.bar{height:10px;border-radius:9px;background:#ffffff1a;overflow:hidden;margin:8px auto;max-width:340px}
.bar i{display:block;height:100%;background:linear-gradient(90deg,#b5432c,#e8b93e);width:0;transition:width .3s}
.row{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;align-items:center}
#needle{width:84px;height:92px}
.lnk{font-size:13px;color:var(--dim);text-decoration:underline;padding:6px}
/* room */
#s-room{background:#000}
#view{flex:1;position:relative;overflow:hidden;touch-action:none;cursor:grab;min-height:0}
#cam{position:absolute;left:50%;top:50%;width:0;height:0;transform-style:preserve-3d;will-change:transform}
#cam.sm{transition:transform .55s ease}
.face{position:absolute;backface-visibility:hidden;-webkit-backface-visibility:hidden}
.face svg{display:block;width:100%;height:100%}
.wallf{left:-600px;top:-380px;width:1200px;height:760px}
.flatf{left:-600px;top:-600px;width:1200px;height:1200px}
#fN{transform:translateZ(-600px)}#fE{transform:rotateY(-90deg) translateZ(-600px)}#fS{transform:rotateY(180deg) translateZ(-600px)}#fW{transform:rotateY(90deg) translateZ(-600px)}
#fF{transform:rotateX(90deg) translateZ(-380px)}#fC{transform:rotateX(-90deg) translateZ(-380px)}
.hs{cursor:pointer}
.p3{position:absolute;left:0;top:0;width:0;height:0;transform-style:preserve-3d}
.bf{position:absolute;backface-visibility:hidden;-webkit-backface-visibility:hidden;cursor:pointer}
.ch{background:repeating-linear-gradient(90deg,#6b4526 0 38px,#553519 38px 41px);box-shadow:inset 0 0 0 6px #2c1a0c,inset 0 0 40px #0008}
.ch.fr,.ch.bk,.ch.lf,.ch.rt{background:linear-gradient(90deg,transparent 12%,#c9952a 12% 19%,transparent 19% 81%,#c9952a 81% 88%,transparent 88%),repeating-linear-gradient(0deg,#6b4526 0 30px,#4f3117 30px 33px)}
.ch.tp{background:linear-gradient(90deg,transparent 12%,#c9952a 12% 19%,transparent 19% 81%,#c9952a 81% 88%,transparent 88%),repeating-linear-gradient(0deg,#7a5230 0 30px,#553519 30px 33px)}
.ch.fr::after{content:"";position:absolute;left:50%;top:0;width:44px;height:54px;margin-left:-22px;background:radial-gradient(circle at 50% 55%,#1a1206 0 7px,transparent 8px),linear-gradient(#f0cf6a,#b8861d);border-radius:0 0 22px 22px;box-shadow:0 2px 6px #000a}
.ch.gold.fr,.ch.gold.bk,.ch.gold.lf,.ch.gold.rt,.ch.gold.tp{background:linear-gradient(90deg,transparent 8%,#f0cf6a 8% 17%,transparent 17% 45%,#f0cf6a 45% 55%,transparent 55% 83%,#f0cf6a 83% 92%,transparent 92%),repeating-linear-gradient(0deg,#5a2620 0 30px,#431a16 30px 33px)}
.lidf.fr::after{display:none}
.ped{background:linear-gradient(#59606a,#3a4048);box-shadow:inset 0 0 0 5px #2a2f36}
.lid{transition:transform 1.4s cubic-bezier(.3,1.4,.5,1)}
.glow{position:absolute;border-radius:12px;background:radial-gradient(ellipse at 50% 50%,#fff6c0,#f3c941 45%,#b8861d);opacity:0;transition:opacity 1s .4s;box-shadow:0 0 60px 30px #f3c94188;pointer-events:none}
.open .glow{opacity:1}
#vig{position:absolute;inset:0;pointer-events:none;z-index:1;background:radial-gradient(ellipse at 50% 50%,transparent 52%,rgba(0,0,0,.6) 100%)}
#dark{position:absolute;inset:0;pointer-events:none;display:none;z-index:2}
.look{position:absolute;top:50%;margin-top:-26px;width:44px;height:52px;border-radius:12px;background:#07141a99;font-size:22px;z-index:3;color:var(--parch)}
#lkL{left:6px}#lkR{right:6px}
#cap{position:absolute;left:10px;right:10px;bottom:10px;z-index:4;background:#07141ae6;border:1px solid #ffffff22;border-radius:14px;padding:11px 14px;font-size:15.5px;line-height:1.4;text-align:center;pointer-events:none;transition:opacity .4s}
#cap.off{opacity:0}
#fx{position:absolute;inset:0;pointer-events:none;z-index:6;overflow:hidden}
.cp{position:absolute;left:50%;top:55%;width:24px;height:24px;border-radius:50%;background:url(../games/neel/img/munt.webp) center/cover,radial-gradient(circle at 35% 30%,#fff3b0,#e8b93e 55%,#9a6d0e);animation:fly var(--d) cubic-bezier(.2,.6,.4,1) forwards}
@keyframes fly{0%{transform:translate(0,0) scale(.4);opacity:1}60%{opacity:1}100%{transform:translate(var(--x),var(--y)) rotate(720deg) scale(1.2);opacity:0}}
/* overlay */
#ov{position:fixed;inset:0;background:#040c10d9;z-index:20;display:none;align-items:center;justify-content:center;padding:16px}
#ov.on{display:flex}
.card{background:var(--parch);color:#2a1c05;border-radius:6px;max-width:440px;width:100%;max-height:90vh;overflow-y:auto;padding:22px 20px 18px;box-shadow:0 20px 60px #000c,inset 0 0 50px #8a651044;position:relative;text-align:center}
.card h3{font-size:22px;color:#6b1f12;margin-bottom:8px}
.card p{font-size:16px;line-height:1.5;margin:8px 0;text-align:left}
.card p.c{text-align:center}
.card .hand{font-style:italic;font-size:17px}
.card .btn{margin-top:10px;font-size:16px;padding:12px 20px}
.card .btn.sec{color:#2a1c05;border-color:#2a1c0566}
.card svg{max-width:100%;height:auto}
.wheels{display:flex;gap:8px;justify-content:center;margin:14px 0}
.wh{display:flex;flex-direction:column;align-items:center;background:#2a1c05;border-radius:10px;padding:4px;box-shadow:inset 0 0 0 2px #b8861d}
.wh button{color:var(--gold);font-size:20px;width:50px;height:38px}
.wh .v{width:50px;height:52px;display:flex;align-items:center;justify-content:center;font-size:30px;color:#fff3c9;background:#120b02;border-radius:6px}
.seqb{display:grid;grid-template-columns:repeat(3,58px);gap:6px;justify-content:center;margin:12px 0}
.seqb button{height:58px;border-radius:50%;background:#2a1c05;color:var(--gold);font-size:22px;box-shadow:inset 0 0 0 2px #b8861d}
.seqd{font-size:24px;letter-spacing:.3em;min-height:34px;color:#6b1f12}
.shake{animation:shake .4s}
@keyframes shake{20%{transform:translateX(-8px)}40%{transform:translateX(8px)}60%{transform:translateX(-5px)}80%{transform:translateX(5px)}}
.inv{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:12px 0}
.inv button{background:#2a1c0514;border-radius:10px;padding:8px 4px;font-size:12.5px;color:#2a1c05;display:flex;flex-direction:column;align-items:center;gap:4px}
.dub{width:64px;height:64px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff3b0,#e8b93e 55%,#9a6d0e);display:flex;align-items:center;justify-content:center;box-shadow:inset 0 0 0 4px #b8861d,0 3px 8px #0006;position:relative}
.dub.big{width:130px;height:130px;margin:8px auto;animation:spin 1.2s ease-out}
.dub img{position:absolute;inset:-3px;width:calc(100% + 6px);height:calc(100% + 6px);border-radius:50%}
.pimg{display:block;width:calc(100% + 40px);margin:-22px -20px 12px;border-radius:6px 6px 0 0}
.letter{position:relative;width:100%;max-width:460px;aspect-ratio:4/5;background:url(../games/neel/img/brief.webp) center/cover,var(--parch);border-radius:8px;box-shadow:0 20px 60px #000c}
.letter .tx{position:absolute;left:17%;top:19%;width:63%;height:55%;overflow-y:auto;color:#3a2408;text-align:left}
.letter .tx p{margin:0 0 .55em;font-style:italic;font-size:clamp(12px,3.4vw,15.5px);line-height:1.36}
.letter .btn{position:absolute;left:8%;bottom:4%}
.card.bare{background:none;box-shadow:none;padding:0;overflow:visible}
.dub .n{position:absolute;right:-4px;bottom:-4px;background:#2a1c05;color:var(--gold);border-radius:50%;width:26px;height:26px;font-size:16px;display:flex;align-items:center;justify-content:center}
.dub.big .n{width:40px;height:40px;font-size:24px}
@keyframes spin{from{transform:rotateY(540deg) scale(.3)}to{transform:none}}
#end{overflow-y:auto;align-items:center;padding:16px 18px 40px;background:radial-gradient(120% 80% at 50% 0,#7a5a12 0,#0a1a22 70%);text-align:center}
#end .in{max-width:460px}
.jig{display:grid;gap:2px;width:min(300px,76vw);aspect-ratio:1;margin:10px auto;background:#2a1c05;padding:3px;border-radius:4px}
.jig button{background:#c9b075 url(../games/neel/img/por-neel.webp) no-repeat;border-radius:2px;position:relative;padding:0}
.jig button.sel{outline:3px solid #e8b93e;transform:scale(.9);z-index:1}
.jig i{position:absolute;left:3px;top:2px;font-style:normal;font-size:12px;color:#fff;background:#0008;border-radius:8px;padding:0 5px}
.xq{font-size:17px;line-height:1.5;margin:8px 0}.xq p{text-align:center}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:10px 0}
.opts button{background:#2a1c05;color:#f3ead2;border-radius:12px;padding:13px 6px;font-size:15.5px;box-shadow:inset 0 0 0 2px #b8861d}
.mem{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;width:min(300px,76vw);margin:10px auto}
.mem button{aspect-ratio:3/4;border-radius:8px;background:repeating-linear-gradient(45deg,#6b1f12 0 7px,#7d2a1a 7px 14px);box-shadow:inset 0 0 0 3px #b8861d;display:flex;align-items:center;justify-content:center;padding:0}
.mem button.up{background:#fff8e0}
.mem button.ok{box-shadow:inset 0 0 0 3px #e8b93e,0 0 10px #e8b93e88}
.reb{display:flex;align-items:center;justify-content:center;gap:12px;font-size:54px;margin:6px 0}
.reb span{background:#fff8e0;border-radius:12px;padding:6px 12px;box-shadow:inset 0 0 0 2px #b8861d;display:flex;flex-direction:column;align-items:center;line-height:1.15}
.reb small{font-size:17px;color:#6b1f12;font-weight:bold}.reb b{font-size:34px;color:#6b1f12}
.pay .eyebrow{font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:#6b1f12;margin-top:14px}
.pay h2{font-size:21px;color:#6b1f12;margin:4px 0}
.pay p{text-align:center}
.pay .inp{width:100%;padding:12px;border-radius:10px;border:2px solid #b8861d;font:inherit;font-size:18px;text-align:center;margin:6px 0;background:#fff8e0;color:#2a1c05;-webkit-user-select:text;user-select:text}
.pay a.btn{display:inline-block;text-decoration:none}
.pay .btn.ghost{background:#2a1c05;color:#f3ead2;box-shadow:none;margin-top:4px}
.pay .note{font-size:14px;text-align:center;margin:6px 0}
.kimg{width:100%;border-radius:14px;display:block;box-shadow:0 10px 40px #000a;margin-bottom:12px}
.neel{width:84px;height:84px;border-radius:50%;float:right;margin:-6px -4px 6px 10px;box-shadow:0 0 0 3px #b8861d,0 4px 10px #0006}
.stat{display:flex;justify-content:space-between;border-bottom:1px dashed #ffffff33;padding:9px 2px;font-size:16px}
.stat b{color:var(--gold);font-weight:normal}
@media (min-width:700px){#cap{left:50%;right:auto;transform:translateX(-50%);max-width:560px;width:100%}}
</style>
