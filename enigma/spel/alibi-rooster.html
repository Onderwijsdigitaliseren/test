.dossier.dicht{opacity:.5}
.dossier .nr{flex:0 0 46px;height:46px;border-radius:50%;border:1px solid var(--goud);display:flex;align-items:center;justify-content:center;font-family:Georgia,serif;color:var(--goud);font-size:18px}
.dossier .t{font-family:Georgia,serif;font-size:17px;color:#efe9da}
.dossier .s{font-size:13px;color:var(--tekstzwak)}
.dossier .st{margin-left:auto;color:var(--goud);font-size:15px;letter-spacing:.1em;white-space:nowrap}

.papier{background:linear-gradient(180deg,var(--papier),var(--papier2));color:var(--inkt);border-radius:8px;padding:14px 14px 12px;

.papier .klein{font-size:12.5px;color:var(--inktzwak);letter-spacing:.08em;text-transform:uppercase}
.stempel{position:absolute;right:12px;top:10px;border:2px solid var(--rood);color:var(--rood);padding:2px 8px;border-radius:4px;font-family:Georgia,serif;letter-spacing:.14em;font-size:11px;transform:rotate(-6deg);opacity:.85}

.kamer-rect{fill:#f3ecd9;stroke:var(--inkt);stroke-width:1.4}
.kamer-lbl{font-family:Georgia,serif;font-size:10.5px;fill:var(--inkt);text-anchor:middle}
.deur{stroke:var(--inkt);stroke-width:1.2;stroke-dasharray:3 2.5;fill:none}

.rooster-wrap{overflow-x:auto;-webkit-overflow-scrolling:touch;margin:0 -6px;padding:0 6px}
table.rooster{border-collapse:separate;border-spacing:3px;width:100%;table-layout:fixed}
table.rooster th{font-family:Georgia,serif;font-weight:normal;font-size:11px;color:var(--inktzwak);padding:2px 0 4px;letter-spacing:.04em}
table.rooster th.m{color:var(--rood);font-weight:bold}
table.rooster th.pers{text-align:left;width:84px;padding-left:2px;position:sticky;left:0;z-index:2;background:linear-gradient(90deg,var(--papier) 85%,rgba(233,223,201,0))}
table.rooster th.pers .n{font-size:12px;color:var(--inkt);display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

  </ul>

  <li><b>Controleer</b> vertelt hoeveel ingevulde cellen fout zijn, niet welke. Dat kost een ster.</li>
  <li><b>Beschuldig</b> als u het weet. U hebt drie pogingen.</li>

  <p>A logic puzzle in time. Each row is a person, each column a quarter of an hour, each cell a room.</p>
  <h3>The rules</h3>
  <ul>
  <li><b>Moving.</b> From one quarter to the next a person stays in the same room, or goes to a room that borders it directly on the floor plan (joined by a dotted line). No further.</li>

function kort(d, r) { const k = d.kamers[r]; return KORT[lang][k.k] || (lang === 'nl' ? k.nl : k.en).slice(0, 4); }
function naam(d, p) { return d.personen[p].naam.replace(/^(Dr\.|Kapitein|Oom|Baron|Barones|Rector)\s+/, '').split(' ')[0]; }
const TITEL_EN = {'Barones ':'Baroness ','Kapitein ':'Captain ','Oom ':'Uncle ','Rector ':'Headmaster '};
function volNaam(d, p) { let n = d.personen[p].naam; if (lang === 'en') for (const k in TITEL_EN) n = n.replace(k, TITEL_EN[k]); return n; }

// ---------- verklaringen in woorden ----------
function rnd(seed) { let a = (seed * 2654435761) >>> 0; return () => { a = (a + 0x6D2B79F5) >>> 0; let t = a; t = Math.imul(t ^ (t >>> 15), t | 1); t ^= t + Math.imul(t ^ (t >>> 7), t | 61); return ((t ^ (t >>> 14)) >>> 0) / 4294967296; }; }
const PREF = {nl:['Ik weet het nog precies: ','Schrijft u dit maar op: ','Dat kan ik u zo vertellen. ','Als u het mij vraagt: ','Ik zweer het: ','Voor zover ik me herinner: ','Luister. ','Ik heb niets te verbergen. ','Het was een vreemde avond, maar dit staat vast: ','Daar hoef ik niet over na te denken. ',''],
              en:['I remember it exactly: ','Write this down: ','I can tell you that right away. ','If you ask me: ','I swear it: ','As far as I recall: ','Listen. ','I have nothing to hide. ','It was a strange evening, but this is certain: ','I don’t have to think about that. ','']};
const SUF = {nl:[' Meer weet ik niet.',' Dat zal niemand ontkennen.',' Vraag het de anderen maar.','',' Zo was het.',' U mag het nakijken.','','']
             ,en:[' That’s all I know.',' Nobody will deny that.',' Ask the others.','',' That’s how it was.',' You may check it.','','']};

function kern(d, w, a) {
  const t = i => d.tijden[i];
  const K = r => kamerNaam(d, r);
  const N = p => naam(d, p);
  const zelf = p => p === w;
  const k = a[0];
  if (lang === 'nl') {
    switch (k) {
      case 'in': return zelf(a[1]) ? `om ${t(a[2])} was ik in ${K(a[3])}` : `om ${t(a[2])} was ${N(a[1])} in ${K(a[3])}`;
      case 'notin': return zelf(a[1]) ? `om ${t(a[2])} was ik niet in ${K(a[3])}` : `om ${t(a[2])} was ${N(a[1])} niet in ${K(a[3])}`;
      case 'with': { const [x, y] = [a[1], a[2]]; if (zelf(x) || zelf(y)) { const o = zelf(x) ? y : x; return `om ${t(a[3])} was ik in dezelfde kamer als ${N(o)}`; } return `om ${t(a[3])} waren ${N(x)} en ${N(y)} in dezelfde kamer`; }
      case 'notwith': { const [x, y] = [a[1], a[2]]; if (zelf(x) || zelf(y)) { const o = zelf(x) ? y : x; return `om ${t(a[3])} was ik niet in dezelfde kamer als ${N(o)}`; } return `om ${t(a[3])} waren ${N(x)} en ${N(y)} niet in dezelfde kamer`; }
      case 'alone': return zelf(a[1]) ? `om ${t(a[2])} was ik alleen in mijn kamer` : `om ${t(a[2])} was ${N(a[1])} alleen in een kamer`;
      case 'count': return zelf(a[1]) ? `om ${t(a[2])} waren we met z’n ${['','','tweeën','drieën','vieren','vijven','zessen','zevenen','achten'][a[3]]} in mijn kamer, mijzelf meegeteld` : `om ${t(a[2])} waren er precies ${a[3]} mensen in de kamer waar ${N(a[1])} was`;
      case 'stay': return zelf(a[1]) ? `van ${t(a[2])} tot en met ${t(a[3])} ben ik in dezelfde kamer gebleven` : `${N(a[1])} is van ${t(a[2])} tot en met ${t(a[3])} in dezelfde kamer gebleven`;
      case 'move': return zelf(a[1]) ? `tussen ${t(a[2])} en ${t(a[2] + 1)} ben ik naar een andere kamer gegaan` : `${N(a[1])} is tussen ${t(a[2])} en ${t(a[2] + 1)} naar een andere kamer gegaan`;
      case 'never_with': { const [x, y] = [a[1], a[2]]; if (zelf(x) || zelf(y)) { const o = zelf(x) ? y : x; return `ik ben de hele avond nooit in dezelfde kamer geweest als ${N(o)}`; } return `${N(x)} en ${N(y)} zijn de hele avond nooit in dezelfde kamer geweest`; }
      case 'visited': return zelf(a[1]) ? `ik ben die avond in ${K(a[2])} geweest` : `${N(a[1])} is die avond in ${K(a[2])} geweest`;
      case 'never': return zelf(a[1]) ? `ik ben de hele avond niet in ${K(a[2])} geweest` : `${N(a[1])} is de hele avond niet in ${K(a[2])} geweest`;
      case 'empty': return `om ${t(a[2])} was er niemand in ${K(a[1])}`;
      case 'step': return zelf(a[1]) ? `ik ben op enig moment rechtstreeks van ${K(a[2])} naar ${K(a[3])} gegaan` : `${N(a[1])} is op enig moment rechtstreeks van ${K(a[2])} naar ${K(a[3])} gegaan`;
    }
  } else {
    switch (k) {
      case 'in': return zelf(a[1]) ? `at ${t(a[2])} I was in ${K(a[3])}` : `at ${t(a[2])} ${N(a[1])} was in ${K(a[3])}`;
      case 'notin': return zelf(a[1]) ? `at ${t(a[2])} I was not in ${K(a[3])}` : `at ${t(a[2])} ${N(a[1])} was not in ${K(a[3])}`;
      case 'with': { const [x, y] = [a[1], a[2]]; if (zelf(x) || zelf(y)) { const o = zelf(x) ? y : x; return `at ${t(a[3])} I was in the same room as ${N(o)}`; } return `at ${t(a[3])} ${N(x)} and ${N(y)} were in the same room`; }
      case 'notwith': { const [x, y] = [a[1], a[2]]; if (zelf(x) || zelf(y)) { const o = zelf(x) ? y : x; return `at ${t(a[3])} I was not in the same room as ${N(o)}`; } return `at ${t(a[3])} ${N(x)} and ${N(y)} were not in the same room`; }
      case 'alone': return zelf(a[1]) ? `at ${t(a[2])} I was alone in my room` : `at ${t(a[2])} ${N(a[1])} was alone in a room`;
      case 'count': return zelf(a[1]) ? `at ${t(a[2])} there were ${['','','two','three','four','five','six','seven','eight'][a[3]]} of us in my room, counting myself` : `at ${t(a[2])} there were exactly ${a[3]} people in the room where ${N(a[1])} was`;
      case 'stay': return zelf(a[1]) ? `from ${t(a[2])} through ${t(a[3])} I stayed in the same room` : `${N(a[1])} stayed in the same room from ${t(a[2])} through ${t(a[3])}`;
      case 'move': return zelf(a[1]) ? `between ${t(a[2])} and ${t(a[2] + 1)} I moved to another room` : `${N(a[1])} moved to another room between ${t(a[2])} and ${t(a[2] + 1)}`;
      case 'never_with': { const [x, y] = [a[1], a[2]]; if (zelf(x) || zelf(y)) { const o = zelf(x) ? y : x; return `all evening I was never in the same room as ${N(o)}`; } return `${N(x)} and ${N(y)} were never in the same room all evening`; }
      case 'visited': return zelf(a[1]) ? `I was in ${K(a[2])} at some point that evening` : `${N(a[1])} was in ${K(a[2])} at some point that evening`;
      case 'never': return zelf(a[1]) ? `I was not in ${K(a[2])} all evening` : `${N(a[1])} was not in ${K(a[2])} all evening`;
      case 'empty': return `at ${t(a[2])} there was nobody in ${K(a[1])}`;
      case 'step': return zelf(a[1]) ? `at some point I went straight from ${K(a[2])} to ${K(a[3])}` : `at some point ${N(a[1])} went straight from ${K(a[2])} to ${K(a[3])}`;
    }
  }
  return JSON.stringify(a);
}
function zin(d, i) {
  const c = d.clues[i];
  const r = rnd(d.seed * 131 + i * 7919 + (lang === 'nl' ? 0 : 1));
  const pre = PREF[lang][Math.floor(r() * PREF[lang].length)];
  const suf = SUF[lang][Math.floor(r() * SUF[lang].length)];
  let k = kern(d, c.w, c.a);
  if (!pre || /\.\s$/.test(pre)) k = k.charAt(0).toUpperCase() + k.slice(1);
  return esc(pre) + '<u>' + esc(k) + '</u>.' + esc(suf);
}

// ---------------- voortgang ----------------
function prog(id) { ST[id] = ST[id] || {rooster:{}, pot:{}, af:{}, pog:3, check:false, sterren:0, klaar:false, eerste:true}; return ST[id]; }
function ontgrendeld(i) { return ALLES || i === 0 || (ST[DATA[i - 1].id] && ST[DATA[i - 1].id].klaar); }

// ---------------- startscherm ----------------
function toonStart() {
  $('kTitel').textContent = lang === 'nl' ? 'Het Alibi-rooster' : 'The Alibi Grid';
  $('kTaal').textContent = lang === 'nl' ? 'EN' : 'NL';
  $('balk').className = '';
  const t = T();
  let h = `<h1 class="groot">${lang === 'nl' ? 'Het Alibi-rooster' : 'The Alibi Grid'}</h1><div class="ondertitel">${lang === 'nl' ? 'Vijf avonden · vijf moorden' : 'Five evenings · five murders'}</div>`;
  h += '<div class="proza">' + t.intro.map(p => `<p>${p}</p>`).join('') + '</div>';
  h += `<div class="rij"><button class="knop rustig" id="bHelp">${t.regels}</button></div>`;
  h += `<div class="ondertitel" style="margin-top:14px">${t.kies}</div><div class="dossiers">`;
  DATA.forEach((d, i) => {
    const v = VERHAAL[d.id][lang]; const p = ST[d.id]; const open = ontgrendeld(i);
    let st = '';
    if (p && p.klaar) st = '★'.repeat(p.sterren) + '☆'.repeat(3 - p.sterren);
    else if (!open) st = '🔒';
    else if (p && Object.keys(p.rooster).length) st = '…';
    h += `<div class="dossier ${open ? '' : 'dicht'}" data-i="${i}"><div class="nr">${['I','II','III','IV','V'][i]}</div><div><div class="t">${v.t}</div><div class="s">${v.h} · ${v.s}</div></div><div class="st">${st}</div></div>`;
  });
  h += '</div>';
  if (DATA.every(d => ST[d.id] && ST[d.id].klaar)) h += `<div class="einde"><div class="groot">${t.klaar}</div><p class="proza">${t.klaarTekst}</p></div>`;
  h += `<div class="rij"><button class="knop rustig" id="bReset" style="font-size:12px;min-height:36px">${t.reset}</button></div>`;
  $('sStart').innerHTML = h;
  $('sStart').classList.add('actief'); $('sDossier').classList.remove('actief');
  $('inhoud').scrollTop = 0;
  $('bHelp').onclick = toonHelp;
  $('bReset').onclick = () => { if (confirm(t.resetVraag)) { ST = {}; bewaar(); toonStart(); } };
  document.querySelectorAll('.dossier').forEach(el => el.onclick = () => { const i = +el.dataset.i; if (ontgrendeld(i)) openDossier(i); });
}

// ---------------- dossier ----------------
let D = null, DI = 0, P = null, potlood = false, actief = null;
function openDossier(i) {
  DI = i; D = DATA[i]; P = prog(D.id); potlood = false; actief = null;
  const v = VERHAAL[D.id][lang]; const t = T();
  $('kTitel').textContent = v.t;
  let h = `<h1 class="groot" style="font-size:26px">${v.t}</h1><div class="ondertitel">${['I','II','III','IV','V'][i]} · ${v.h}</div>`;
  h += '<div class="proza">' + v.i.map(p => `<p>${p}</p>`).join('') + '</div>';
  // plattegrond
  h += `<div class="papier"><div class="klein">${t.plattegrond} · ${v.h}</div>${plattegrondSVG()}<div class="legenda">${D.kamers.map((k, r) => `<span><i style="background:var(--k${r})"></i>${lang==='nl'?k.nl:k.en}</span>`).join('')}</div></div>`;
  // rooster
  h += `<div class="papier"><div class="stempel">${t.moordmoment} ${D.tijden[D.M]}</div><div class="klein">${t.rooster}</div><div class="rooster-wrap" id="roosterWrap"></div><div id="bericht"></div></div>`;
  // verklaringen
  h += `<div class="papier"><div class="klein">${t.verklaringen} · ${D.clues.length}</div><div class="verklaringen" id="verklaringen"></div></div>`;
  h += `<div class="papier" id="epiloog" style="display:none"></div>`;
  $('sDossier').innerHTML = h;
  $('sStart').classList.remove('actief'); $('sDossier').classList.add('actief');
  $('inhoud').scrollTop = 0;
  tekenRooster(); tekenVerklaringen(); tekenBalk();
  if (P.klaar) toonEinde(false);
}

function plattegrondSVG() {
  const U = 30;
  const x0 = Math.min(...D.kamers.map(k => k.x)) * U, y0 = Math.min(...D.kamers.map(k => k.y)) * U;
  const x1 = Math.max(...D.kamers.map(k => k.x + k.w)) * U, y1 = Math.max(...D.kamers.map(k => k.y + k.h)) * U;
  const c = k => [(k.x + k.w / 2) * U, (k.y + k.h / 2) * U];
  let s = `<svg id="plan" viewBox="${x0 - 4} ${y0 - 4} ${x1 - x0 + 8} ${y1 - y0 + 8}" style="max-height:${Math.round((y1 - y0) * 1.6)}px" xmlns="http://www.w3.org/2000/svg">`;
  D.adj.forEach(([a, b]) => { const [x1, y1] = c(D.kamers[a]), [x2, y2] = c(D.kamers[b]); s += `<line class="deur" x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}"/>`; });
  D.kamers.forEach((k, r) => {
    const x = k.x * U + 3, y = k.y * U + 3, w = k.w * U - 6, hh = k.h * U - 6;
    const n = lang === 'nl' ? k.nl : k.en;
    s += `<rect x="${x}" y="${y}" width="${w}" height="${hh}" rx="3" fill="#f3ecd9"/><rect class="kamer-rect" x="${x}" y="${y}" width="${w}" height="${hh}" rx="3" style="fill:var(--k${r});fill-opacity:.55"/>`;
    s += `<text class="kamer-lbl" x="${x + w / 2}" y="${y + hh / 2 + 3}">${esc(n)}</text>`;
  });
  s += '</svg>';
  return s;
}

function tekenRooster() {
  const t = T();
  let h = `<table class="rooster" style="min-width:${84 + D.T * 46}px"><thead><tr><th class="pers"></th>`;
  D.tijden.forEach((tt, i) => h += `<th class="${i === D.M ? 'm' : ''}">${tt}</th>`);
  h += '</tr></thead><tbody>';
  D.personen.forEach((p, pi) => {
    const rol = lang === 'nl' ? p.nl : p.en;
    h += `<tr><th class="pers"><span class="n">${pi === 0 ? '† ' : ''}${esc(naam(D, pi))}</span><span class="r">${esc(rol)}</span></th>`;
    for (let ti = 0; ti < D.T; ti++) {
      const key = pi + '_' + ti;
      if (pi === 0 && ti > D.M) { h += `<td class="cel dood">†</td>`; continue; }
      const r = P.rooster[key];
      const cls = ['cel']; if (ti === D.M) cls.push('m');
      if (r !== undefined) cls.push('gezet');
      if (actief === key) cls.push('actief');
      if (P.klaar) cls.push(r === D.sol[pi][ti] ? 'goed' : 'fout');
      const kleur = r !== undefined ? `style="background:var(--k${r})"` : '';
      let inner = r !== undefined ? esc(kort(D, r)) : '';
      const pot = P.pot[key] || [];
      if (r === undefined && pot.length) inner += '<span class="pot">' + pot.map(x => `<i style="background:var(--k${x})"></i>`).join('') + '</span>';
      h += `<td class="${cls.join(' ')}" data-k="${key}" ${kleur}>${inner}</td>`;
    }
    h += '</tr>';
  });
  h += '</tbody></table>';
  $('roosterWrap').innerHTML = h;
  if (!P.klaar) document.querySelectorAll('td.cel:not(.dood)').forEach(td => td.onclick = () => kiesCel(td.dataset.k));
}

function tekenVerklaringen() {
  const t = T();
  let h = '', vorige = -1;
  D.clues.forEach((c, i) => {
    if (c.w !== vorige) { h += `<div class="wie">${esc(volNaam(D, c.w))} <small>· ${esc(lang === 'nl' ? D.personen[c.w].nl : D.personen[c.w].en)}</small></div>`; vorige = c.w; }
    h += `<div class="verklaring ${P.af[i] ? 'af' : ''}" data-i="${i}"><span class="q">${zin(D, i)}</span></div>`;
  });
  $('verklaringen').innerHTML = h;
  document.querySelectorAll('.verklaring').forEach(el => el.onclick = () => { const i = el.dataset.i; P.af[i] = !P.af[i]; bewaar(); el.classList.toggle('af', !!P.af[i]); });
}

function tekenBalk() {
  const t = T(); const b = $('balk');
  if (P.klaar) { b.className = 'aan'; b.innerHTML = `<button class="knop rustig" id="bTerug2">${t.terug}</button>` + (DI < DATA.length - 1 && ontgrendeld(DI + 1) ? `<button class="knop goud" id="bVolg">${t.volgende}</button>` : ''); $('bTerug2').onclick = toonStart; if ($('bVolg')) $('bVolg').onclick = () => openDossier(DI + 1); return; }
  b.className = 'aan';
  b.innerHTML = `<button class="knop rustig" id="bPot">✎ ${t.potlood}</button><button class="knop rustig" id="bCheck">${t.controleer}</button><button class="knop" id="bAcc">${t.beschuldig}</button>`;
  $('bPot').onclick = () => { potlood = !potlood; $('bPot').style.borderColor = potlood ? 'var(--goud)' : ''; $('bPot').style.color = potlood ? '#f3e6c6' : ''; };
  $('bCheck').onclick = controleer;
  $('bAcc').onclick = beschuldig;
}

function kiesCel(key) {
  actief = key; tekenRooster();
  const [pi, ti] = key.split('_').map(Number);
  const t = T();
  let h = `<h3>${esc(naam(D, pi))} · ${D.tijden[ti]}${potlood ? ' · ✎' : ''}</h3><div class="chips">`;
  const cur = P.rooster[key]; const pot = P.pot[key] || [];
  D.kamers.forEach((k, r) => h += `<button class="chip ${potlood ? (pot.includes(r) ? 'aan' : '') : (cur === r ? 'aan' : '')}" data-r="${r}" style="background:var(--k${r})">${esc(lang === 'nl' ? k.nl : k.en)}</button>`);
  h += `<button class="chip leeg" data-r="-1">${t.leeg}</button></div>`;
  h += `<div class="schakel"><button id="sPot" class="${potlood ? 'aan' : ''}">✎ ${t.potlood}</button><span>${potlood ? t.kandidaat : t.zet}</span></div>`;
  openSheet(h);
  $('sPot').onclick = () => { potlood = !potlood; kiesCel(key); };
  document.querySelectorAll('#sheet .chip').forEach(ch => ch.onclick = () => {
    const r = +ch.dataset.r;
    if (potlood) {
      if (r < 0) { delete P.pot[key]; }
      else { const a = P.pot[key] || []; const j = a.indexOf(r); if (j >= 0) a.splice(j, 1); else a.push(r); a.sort(); P.pot[key] = a; }
      bewaar(); kiesCel(key); return;
    }
    if (r < 0) delete P.rooster[key]; else P.rooster[key] = r;
    bewaar(); actief = null; sluitSheet(); tekenRooster();
  });
}

function openSheet(h) { $('sheetVel').innerHTML = h; $('sheet').classList.add('aan'); }
function sluitSheet() { $('sheet').classList.remove('aan'); actief = null; }
$('sheet').onclick = e => { if (e.target === $('sheet')) { sluitSheet(); tekenRooster(); } };

function bericht(txt, cls) { $('bericht').innerHTML = txt ? `<div class="bericht ${cls || ''}">${txt}</div>` : ''; }

function controleer() {
  const t = T(); let n = 0, f = 0;
  for (const key in P.rooster) { const [pi, ti] = key.split('_').map(Number); n++; if (P.rooster[key] !== D.sol[pi][ti]) f++; }
  if (n > 0) { P.check = true; bewaar(); }
  bericht(t.controle(f, n), f === 0 && n > 0 ? 'goed' : 'info');
}

function roosterCompleetGoed() {
  for (let pi = 0; pi < D.personen.length; pi++) for (let ti = 0; ti < (pi === 0 ? D.M + 1 : D.T); ti++) if (P.rooster[pi + '_' + ti] !== D.sol[pi][ti]) return false;
  return true;
}

function beschuldig() {
  const t = T();
  let h = `<h3>${t.wie}</h3><div class="verdachten">`;
  for (let pi = 1; pi < D.personen.length; pi++) h += `<button class="verdachte ${P.uit && P.uit.includes(pi) ? 'uit' : ''}" data-p="${pi}"><span class="av av${pi}">${esc(naam(D, pi)[0])}</span><span>${esc(volNaam(D, pi))}<br><small style="opacity:.7">${esc(lang === 'nl' ? D.personen[pi].nl : D.personen[pi].en)}</small></span></button>`;
  h += `</div><p style="color:var(--tekstzwak);font-size:13px;margin:10px 0 0">${t.pogingen(P.pog)}</p>`;
  openSheet(h);
  document.querySelectorAll('.verdachte').forEach(el => el.onclick = () => {
    const pi = +el.dataset.p; sluitSheet();
    if (pi === D.killer) {
      let st = 1; if (P.eerste && !P.check) st++; if (roosterCompleetGoed()) st++;
      P.sterren = st; P.klaar = true; bewaar(); toonEinde(true);
    } else {
      P.eerste = false; P.pog--; P.uit = P.uit || []; P.uit.push(pi); bewaar();
      if (P.pog <= 0) { P.sterren = 0; P.klaar = true; bewaar(); toonEinde(false, true); }
      else bericht(t.fout(naam(D, pi)) + ' ' + t.pogingen(P.pog));
    }
  });
}

function toonEinde(net, mis) {
  const t = T(); const v = VERHAAL[D.id][lang];
  // oplossing in rooster
  for (let pi = 0; pi < D.personen.length; pi++) for (let ti = 0; ti < (pi === 0 ? D.M + 1 : D.T); ti++) P.rooster[pi + '_' + ti] = D.sol[pi][ti];
  bewaar(); tekenRooster(); tekenBalk();
  bericht(mis ? t.mis : t.goed + ' ' + (lang === 'nl' ? 'De moordenaar:' : 'The killer:') + ' <b>' + esc(volNaam(D, D.killer)) + '</b>, ' + kamerNaam(D, D.sol[0][D.M]) + ', ' + D.tijden[D.M] + '.', mis ? '' : 'goed');
  const e = $('epiloog'); e.style.display = 'block';
  e.innerHTML = `<div class="klein">${lang === 'nl' ? 'Epiloog' : 'Epilogue'}</div><p class="proza" style="color:var(--inkt);margin:8px 0">${v.e}</p><div class="sterren" style="color:#8a6a2a">${'★'.repeat(P.sterren)}${'☆'.repeat(3 - P.sterren)}<small style="color:var(--inktzwak)">${t.sterUitleg.map((s, i) => (i < P.sterren ? '★ ' : '☆ ') + s).join(' · ')}</small></div>`;
  if (net) setTimeout(() => e.scrollIntoView({behavior: 'smooth', block: 'center'}), 200);
}

// ---------------- hulp / taal ----------------
function toonHelp() { $('helpVel').innerHTML = T().helpHtml + `<div class="rij"><button class="knop rustig" id="hSluit">OK</button></div>`; $('help').classList.add('aan'); $('hSluit').onclick = () => $('help').classList.remove('aan'); }
$('kHelp').onclick = toonHelp;
$('help').onclick = e => { if (e.target === $('help')) $('help').classList.remove('aan'); };
$('kTaal').onclick = () => { lang = lang === 'nl' ? 'en' : 'nl'; try { localStorage.setItem('hm_lang', lang); } catch (e) {} history.replaceState(null, '', '#' + lang); document.documentElement.lang = lang; $('kTaal').textContent = lang === 'nl' ? 'EN' : 'NL'; if ($('sDossier').classList.contains('actief')) openDossier(DI); else toonStart(); };
$('kTerug').onclick = () => { sluitSheet(); toonStart(); };
function init() { document.documentElement.lang = lang; toonStart(); }
init();
</script>
